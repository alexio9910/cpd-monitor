# Límites de retención de logs para el sistema de monitorización del CPD.
# Sin esto, journald puede crecer sin límite y llenar la tarjeta SD con
# el tiempo en un servicio pensado para correr meses/años sin supervisión.
#
# Instalación: copiar a /etc/systemd/journald.conf.d/cpd-monitor.conf y
# reiniciar systemd-journald. Ver docs/MANUAL-EXPERTO.md, seccion 8.
[Journal]
Storage=persistent
SystemMaxUse=200M
MaxRetentionSec=90day
