name: build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  compilar-y-verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Resolver dependencias (go mod tidy)
        run: go mod tidy

      - name: go vet
        run: go vet ./...

      - name: Compilar
        run: go build -v ./...

      - name: Comprobar que go.mod / go.sum están limpios
        run: |
          git diff --exit-code go.mod go.sum || \
          (echo "go.mod/go.sum no están sincronizados: ejecuta 'go mod tidy' en local y haz commit." && exit 1)
