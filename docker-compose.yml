# Stack de almacenamiento y visualización para la monitorización del CPD.
#
# El colector Go NO está en este docker-compose a propósito: necesita
# acceso directo al adaptador Bluetooth del host a través de BlueZ/D-Bus,
# y meterlo en un contenedor obliga a montar sockets del sistema y usar
# red en modo "host", lo que complica el proyecto sin aportar nada en un
# primer despliegue. El colector se ejecuta como servicio systemd nativo
# en el host (ver deploy/systemd/cpd-monitor.service y el README).

services:
  influxdb:
    # Versión fija (nunca "latest"): evita que un simple reinicio del
    # contenedor cambie de versión sin que te des cuenta.
    image: influxdb:2.7
    container_name: cpd-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
      TZ: Europe/Madrid
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8086/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  grafana:
    # Usamos "grafana/grafana" (no "grafana/grafana-oss"): ese segundo
    # repositorio dejó de actualizarse a partir de la 12.4.0. Comprueba
    # https://hub.docker.com/r/grafana/grafana/tags si quieres una
    # versión más reciente, y fija siempre un número concreto (nunca
    # "latest").
    image: grafana/grafana:13.0.2
    container_name: cpd-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GRAFANA_INFLUXDB_TOKEN: ${GRAFANA_INFLUXDB_TOKEN}
      GRAFANA_ALERT_EMAILS: ${GRAFANA_ALERT_EMAILS}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL}
      GRAFANA_ORG_NAME: ${GRAFANA_ORG_NAME}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM_ADDRESS}
      GF_SMTP_FROM_NAME: "CPD Monitor Alertas"
      GF_SMTP_STARTTLS_POLICY: "MandatoryStartTLS"
      TZ: Europe/Madrid
    depends_on:
      influxdb:
        condition: service_healthy

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
