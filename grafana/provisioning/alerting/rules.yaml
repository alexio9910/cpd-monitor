- orgId: 1
  name: CPD-Sin-Datos
  folder: CPD - Monitorización ambiental
  interval: 30s
  rules:
  - uid: afy888pyx4s1sa
    title: 🔴 Sensor CPD sin datos - Posible fallo de monitorización
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 2592000
        to: 0
      datasourceUid: influxdb-cpd
      model:
        intervalMs: 1000
        maxDataPoints: 43200
        query: "from(bucket: \"cpd_monitorizacion\")\r\n  |> range(start: -30d)\r\n  |> filter(fn: (r) => r._measurement == \"cpd_ambiente\")\r\n  |> filter(fn: (r) => r._field == \"temperatura_c\")\r\n  |> last()\r\n  |> map(fn: (r) => ({ r with _value: float(v: int(v: now()) - int(v: r._time)) / 1000000000.0 / 60.0 }))\r\n  |> keep(columns: [\"_time\", \"_value\", \"sensor_id\", \"ubicacion\"])"
        refId: A
    - refId: B
      queryType: expression
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params: []
            type: gt
          operator:
            type: and
          query:
            params: []
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        reducer: last
        refId: B
        type: reduce
    - refId: C
      queryType: expression
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 10
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: B
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
    dashboardUid: cpd-temp-humedad
    panelId: 1
    noDataState: Alerting
    execErrState: Error
    for: 30s
    annotations:
      __dashboardUid__: cpd-temp-humedad
      __panelId__: '1'
      description: Alerta de disponibilidad del colector CPD Monitor
      summary: 'Un sensor del CPD no ha enviado ninguna lectura en más de 10 minutos.


        Esto puede deberse a que el sensor está fuera de alcance, tiene la pila agotada, o hay un problema con el servicio de recolección en la Raspberry Pi.


        Revisa el estado del colector y la conexión Bluetooth del sensor.'
    labels:
      tipo: sin_datos
    isPaused: false
    notification_settings:
      receiver: email-cpd
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1d
